name: GitHub Streak Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto commit
        run: |
          git config --local user.name "${{ github.repository_owner }}"
          git config --local user.email "${{ github.repository_owner }}@users.noreply.github.com"

          commit_count=$((RANDOM % 10 + 1))
          for commit_number in $(seq 1 "$commit_count"); do
            printf '%s heartbeat %s/%s\n' "$(date -u --iso-8601=seconds)" "$commit_number" "$commit_count" >> heartbeat.txt
            git add heartbeat.txt
            git commit -m "chore: daily heartbeat ${commit_number}/${commit_count} [skip ci]"
          done

          git push
